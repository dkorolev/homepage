[package]
name = "homepage-webauthn"
version = "1.0.0"
edition = "2021"

[dependencies]
askama = "0.12"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2.5"
webauthn-rs = "0.5"
