[package]
name = "homepage-oauth"
version = "1.0.0"
edition = "2021"

[dependencies]
askama = "0.12"
axum = { version = "0.7", features = ["json"] }
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.13", default-features = true, features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
