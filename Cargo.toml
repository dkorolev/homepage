[workspace]
members = [
  "crates/app",
  "crates/oauth",
  "crates/webauthn",
  "crates/mcpclient",
]
resolver = "2"

[profile.fast-release]
inherits = "release"
# Optimize for shorter rebuilds while keeping release-like codegen.
incremental = true
codegen-units = 256
debug = 0
strip = "debuginfo"
